# THEO VIDEO STUDIO Android APK build.
# Manual runs build the version in gradle.properties and upload an installable APK artifact.
# Version tags build the same APK and create a draft GitHub release.
name: THEO VIDEO STUDIO - Android APK

on:
  push:
    branches: [feature/theo-video-studio-branding]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theo-video-studio-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  GGML_NATIVE: "OFF"
  NDK_VERSION: 29.0.14206865

jobs:
  apk:
    name: Build THEO VIDEO STUDIO APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^capcraft\.version=//p' src/crates/capcraft-android/android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a valid semantic version"
            exit 1
          fi
          if [ "$v" != "$listed" ]; then
            echo "::error::tag version v$v does not match gradle.properties version $listed"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "## THEO VIDEO STUDIO v$v (${GITHUB_SHA::9})" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      - name: Install pinned Rust toolchain
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Install cargo-ndk and Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Restore FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v5
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ env.NDK_VERSION }}-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}

      - name: Build FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android

      - name: Save FFmpeg cache
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Fetch sherpa-onnx runtime
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: theo-video-studio-android

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "CAPCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::A release keystore is required for version-tag releases."
            exit 1
          else
            echo "::warning::No release keystore configured; manual build will use the debug signing key."
          fi

      - name: Build THEO VIDEO STUDIO
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CAPCRAFT_KEYSTORE_PASSWORD: ${{ secrets.CAPCRAFT_KEYSTORE_PASSWORD }}
          CAPCRAFT_KEY_ALIAS: ${{ secrets.CAPCRAFT_KEY_ALIAS }}
          CAPCRAFT_KEY_PASSWORD: ${{ secrets.CAPCRAFT_KEY_PASSWORD }}
        run: |
          cd src
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cd crates/capcraft-android/android
          ./gradlew assembleRelease "-Pcapcraft.abis=arm64-v8a" "-Pcapcraft.version=$VERSION" --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/theo-video-studio-$VERSION.apk"

      - name: Verify APK signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify "$apk"
            if [ "$GITHUB_REF_TYPE" = tag ] && "$apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: theo-video-studio-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  release:
    name: Draft GitHub Release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: theo-video-studio-apk
          path: dist

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "THEO VIDEO STUDIO $GITHUB_REF_NAME" --notes "## THEO VIDEO STUDIO - What's Changed" -- dist/*
          echo "Draft THEO VIDEO STUDIO release is ready for review." >>"$GITHUB_STEP_SUMMARY"
